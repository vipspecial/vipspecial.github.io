<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="面向 RAG、AI Agent 与 LLM 应用工程的实践站点">
  <meta name="theme-color" content="#07111f">
  <title>AI Engineering Lab</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
</head>
<body>
  <div id="app">
    <div class="app-loading" role="status">
      <span class="app-loading__mark">AI</span>
      <span>正在装载工程工作台...</span>
    </div>
  </div>

  <script src="assets/js/ai-data-service.js"></script>
  <script src="assets/js/ai-components.js"></script>
  <script>
    window.$docsify = {
      name: 'AI Engineering Lab',
      nameLink: '#/',
      repo: 'vipspecial/vipspecial.github.io',
      homepage: 'README.md',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      routerMode: 'hash',
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      notFoundPage: true,
      search: {
        paths: 'auto',
        placeholder: '搜索 AI 工程与知识库',
        noData: '没有找到相关内容',
        depth: 4
      },
      plugins: [
        window.AiPortalPlugin,
        function (hook) {
          hook.afterEach(function (html) {
            var year = new Date().getFullYear()
            var footer = [
              '<footer class="site-footer">',
              '<span>AI Engineering Lab · ', year, '</span>',
              '<span>静态站点，动态连接开放数据与独立后端服务</span>',
              '</footer>'
            ].join('')
            return html + footer
          })
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
</body>
</html>
