<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AI 对话与 Agent 工作台">
  <meta name="theme-color" content="#eb6a2a">
  <title>AI Workspace</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.2.8/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/ibm-plex-sans@5.2.8/index.css">
  <link rel="stylesheet" href="assets/css/site.css?v=20260828.24">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
</head>
<body>
  <div id="app">
    <div class="app-loading" role="status">
      <span class="app-loading__mark">AI</span>
      <span>正在加载...</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="assets/js/ai-data-service.js"></script>
  <script src="assets/js/ai-components.js?v=20260828.4"></script>
  <script>
    window.$docsify = {
      name: 'AI Workspace',
      nameLink: '#/',
      repo: 'vipspecial/vipspecial.github.io',
      homepage: 'README.md',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      routerMode: 'hash',
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,
      notFoundPage: true,
      plugins: [
        window.AiPortalPlugin,
        function (hook) {
          hook.afterEach(function (html) {
            var year = new Date().getFullYear()
            var footer = [
              '<footer class="site-footer">',
              '<span>AI Workspace · ', year, '</span>',
              '<a href="https://vipspecial.github.io/knowledge-is-power/" target="_blank" rel="noopener noreferrer">开源项目 · 拿了桔子跑啊</a>',
              '<span>GitHub Pages × Python API</span>',
              '</footer>'
            ].join('')
            return html + footer
          })
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
</body>
</html>
